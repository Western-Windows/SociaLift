<path d="M470 688 L340 688 L340 690" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="10" font-family="sans-serif" fill="#A32D2D" x="390" y="680" text-anchor="middle" dominant-baseline="central">fused top-K docs</text>

