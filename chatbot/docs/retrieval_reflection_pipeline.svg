<text font-size="11" font-family="sans-serif" fill="#0F6E56" x="360" y="533" dominant-baseline="central">yes</text>

<!-- NO path: right then down to rag fusion -->
<path d="M440 480 L570 480 L570 580" fill="none" stroke="#E24B4A" stroke-width="1.5" marker-end="url(#arrow)"/>
<text font-size="11" font-family="sans-serif" fill="#A32D2D" x="488" y="470" dominant-baseline="central">not relevant</text>

