<rect x="126" y="618" width="198" height="24" rx="5" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
<text font-size="10" font-family="sans-serif" fill="#2C2C2A" x="225" y="630" text-anchor="middle" dominant-baseline="central">Format context + metadata</text>

<rect x="126" y="650" width="198" height="24" rx="5" fill="#FFFFFF" stroke="#D3D1C7" stroke-width="0.5"/>
