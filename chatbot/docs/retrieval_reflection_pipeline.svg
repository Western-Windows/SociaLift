<text font-size="11" font-family="sans-serif" fill="#0F6E56" x="480" y="171" text-anchor="middle" dominant-baseline="central">Embedding cosine similarity</text>
<text font-size="11" font-family="sans-serif" fill="#0F6E56" x="480" y="188" text-anchor="middle" dominant-baseline="central">Top-K conceptual docs</text>

