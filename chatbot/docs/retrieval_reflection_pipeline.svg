<text font-size="10" font-family="sans-serif" fill="#FAECE7" x="570" y="737" text-anchor="middle" dominant-baseline="central">result sets</text>

<!-- RAG fusion LLM badge -->
<rect x="630" y="596" width="34" height="20" rx="4" fill="#D85A30" stroke="#993C1D" stroke-width="0.5"/>
<text font-size="9" font-weight="500" font-family="sans-serif" fill="#FAECE7" x="647" y="606" text-anchor="middle" dominant-baseline="central">LLM</text>

